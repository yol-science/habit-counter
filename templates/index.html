<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>習慣カウンター</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
  <h1>ライフ式 習慣カウンター</h1>

  <!-- 🔐 小さめホスト -->
  <div class="host-mini">
    <input type="password" id="hostPassword" placeholder="ホスト">
    <button onclick="hostLogin()">ログイン</button>
  </div>

  <!-- 🌱 追加もカード化 -->
  <div class="card add-card">
    <h3>🌱 習慣を追加</h3>
    <input type="text" id="newHabit" placeholder="新しい習慣を追加">
    <button onclick="addHabit()">追加</button>
  </div>

  <div id="status" class="card-area"></div>
</div>

<script>
function heart(life){
  return "❤️".repeat(life) + "🖤".repeat(3-life)
}

function add(activity){
  fetch("/api/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({activity})
  }).then(()=>refresh())
}

function addHabit(){
  const name = document.getElementById("newHabit").value
  if(!name) return

  fetch("/api/add_habit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name})
  }).then(()=>{
    document.getElementById("newHabit").value=""
    refresh()
  })
}

function deleteHabit(name){
  fetch("/api/delete_habit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name})
  }).then(refresh)
}

function refresh(){
  fetch("/api/today")
    .then(r=>r.json())
    .then(data=>{
      let output=""

      if(data.length === 0){
        output = "<p>まだ習慣がありません 🌱</p>"
      } else {

        data.forEach(item=>{
          output += `
          <div class="card">
            <h2>${item.name}</h2>
            <div class="life">${heart(item.life)}</div>
            <div class="total">累計: ${item.total}</div>
            <button 
              onclick="add('${item.name}')"
              ${item.life <= 0 ? "disabled" : ""}>
              +1
            </button>
            <button onclick="deleteHabit('${item.name}')">削除</button>
          `

          if(isHost){
            output += `
              <div class="host-edit">
                Life: <input type="number" id="life-${item.name}" value="${item.life}">
                Total: <input type="number" id="total-${item.name}" value="${item.total}">
                <button onclick="hostUpdate('${item.name}')">更新</button>
              </div>
            `
          }

          output += `</div>`
        })

      }

      document.getElementById("status").innerHTML = output
    })
}

let isHost = false;

function hostLogin(){
  const password = document.getElementById("hostPassword").value

  fetch("/api/host_login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password})
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.message){
      isHost = true
      alert("ホストモードON")
      refresh()
    } else {
      alert("パスワードが違います")
    }
  })
}

function hostUpdate(name){
  const life = document.getElementById(`life-${name}`).value
  const total = document.getElementById(`total-${name}`).value

  fetch("/api/host_update",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name, life, total})
  }).then(refresh)
}

refresh()
</script>

</body>
</html>
